## Provide a name in place of the chart name for `app:` labels
nameOverride: ""

## Provide a name to substitute for the full names of resources
fullnameOverride: ""

## Labels to apply to all resources
commonLabels: {}

## Secrets used to pull the container image from a private registry
imagePullSecrets: []
  # - name: biblionx-registry

global:  
  appName: biblionx-translator
  ## Reference to one or more secrets to be used when pulling images
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  imagePullSecrets:
  # - name: "image-pull-secret"
  # or
  # - "image-pull-secret"
  # Global Configuration
  # These values are used as default settings for the Services  connections.
  # They serve as fallback values when specific configurations are not provided for
  # either the internal or external databases. This approach promotes
  # reusability of these configurations across different parts of your Helm chart,
  # helping to maintain consistency and reduce redundancy.
  redis:
    # usePassword: true
    # password: "changeme"
    # cachename: "changemeName"
    # host: "changeme"
    # port: 6379
  amqp:
    # port: 5672
    # username: biblionx
    # password: biblionxchangeme
    # host: "changeme"
  

tradcore:
  replicaCount: 6
  image:
    repository: "biblionx/translator-text-core"
    tag: ""
  
  pullPolicy: Always

  appConfig:
    LOGGER_FORMAT: 'production' #dev or production
    PORT: '80'
    AMQP_PROTOCOL: 'amqp'
    AMQP_PREFETCH_COUNT: 1
    LOGGER_CONFIG_FILE: "/dist/config/logging-dev.ini"
    HEALTHCHECK_PORT: '8080'
    # Env var names below are kept unchanged for compatibility with the upstream translation engine (vlibras-translator package).
    VLIBRAS_DL_MODEL_TAG: "v1.3.0"
    VLIBRAS_FORCE_MODEL_DOWNLOAD: 'true'


  secrets:
    # The existingSecret field is more like a boolean. 
    # if it's empty, this chart creates a secret based on the appSecret values below
    # if it's NOT empty, the chart doesn't create a secret and uses the existingSecret instead.
    existingSecret: "biblionx-translator-core-appsecret"
    
    appSecret:
      ENABLE_DL_TRANSLATION : 'true'
      GIT_SSL_NO_VERIFY: '1'
      TRANSLATOR_QUEUE: "translate.to_text"
      VIDEOMAKER_QUEUE: "translate.to_video"

  service:
    type: ClusterIP
    port: 80

  #httpRelativePath: /
  ## Configure extra options for containers' liveness, readiness and startup probes
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
  ## @param livenessProbe.enabled Enable livenessProbe on translator core containers
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 1
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param readinessProbe.enabled Enable readinessProbe on translator core containers
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  ## When enabling this, make sure to set initialDelaySeconds to 0 for livenessProbe and readinessProbe
  ## @param startupProbe.enabled Enable startupProbe on translator core containers
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  ## @param startupProbe.periodSeconds Period seconds for startupProbe
  ## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
  ## @param startupProbe.failureThreshold Failure threshold for startupProbe
  ## @param startupProbe.successThreshold Success threshold for startupProbe
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 45
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 60
    successThreshold: 1

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      memory: "4Gi"
      cpu: "4"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Default connection settings for the internal RabbitMQ and Redis services.

rabbitmqha:
  enabled: true
  port: 5672
  rabbitmqUsername: biblionx
  rabbitmqPassword: biblionxchangeme
  existingSecrets: "biblionx-translator-rabbitmq-credentials"

redis:
  enabled: true
  usePassword: true
  password: "changeme"
  cachename: "changemeName"
  redisPort: 6379
  existingSecrets: "biblionx-translator-redis-credentials"

# Connection settings for external services (RabbitMQ and Redis).
# Values set here take precedence over the global and internal defaults above.
externalServices:
  tradcore:
    amqp:
      enabled: true
      port: 5672
      username: "trad_usr_amqp"
      password: "changeme"
      host: "rabbitmq.example.com"
      existingSecrets: "biblionx-translator-rabbitmq-credentials"
      #existingClaim: ""
    redis:
      enabled: true
      usePassword: true
      password: "changeme"
      cachename: "changemeName"
      redisPort: 6379
      host: "redis.example.com"
      existingSecrets: "biblionx-translator-redis-credentials"
      #existingClaim: ""