services:
  biblionx-translator-text-core:
    build: .
    image: biblionx/translator-text-core:4.2.0
    networks:
      - rabbitmq-net
    environment:
      BIBLIONX_AMQP_HOST: rabbitmq
      AMQP_HOST: rabbitmq
      BIBLIONX_AMQP_PORT: 5672
      AMQP_PORT: 5672
      BIBLIONX_AMQP_USER: ${BIBLIONX_AMQP_USER:-${AMQP_USER:-guest}}
      AMQP_USER: ${AMQP_USER:-guest}
      BIBLIONX_AMQP_PASS: ${BIBLIONX_AMQP_PASS:-${AMQP_PASS:-guest}}
      AMQP_PASS: ${AMQP_PASS:-guest}
      BIBLIONX_AMQP_PREFETCH_COUNT: 1
      AMQP_PREFETCH_COUNT: 1
      BIBLIONX_TRANSLATOR_QUEUE: "translate.to_text"
      TRANSLATOR_QUEUE: "translate.to_text"
      BIBLIONX_ENABLE_DL_TRANSLATION: "true"
      ENABLE_DL_TRANSLATION: "true"
      BIBLIONX_HEALTHCHECK_PORT: 80
      HEALTHCHECK_PORT: 80
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management-alpine
    networks:
      - rabbitmq-net
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5673:5672
      - 15673:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}

networks:
  rabbitmq-net:

volumes:
  rabbitmq-data:
